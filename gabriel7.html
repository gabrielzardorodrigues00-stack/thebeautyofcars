<main class="container-fluid px-3 px-md-4 py-4 w-100" id="form">
<form action="" class="container card shadow-sm p-3 p-md-4" method="post">
<fieldset class="border-0 border rounded-3 p-3 mb-4">
<legend>Feedback sobre carros</legend>
<label class="form-label fw-semibold" for="gostou">Você gostou do site?</label>
<select class="form-select mb-3 form-control" id="gostou" name="escolha" required="">
<option value="">Escolha</option>
<option value="s">Sim</option>
<option value="n">Não</option>
</select>
<label class="form-label fw-semibold" for="melhoria">O que posso melhorar?</label>
<textarea class="form-control mb-3" id="melhoria" name="melhoria" placeholder="Digite seu texto aqui" required=""></textarea>
<label class="form-label fw-semibold" for="carro">Qual seu carro favorito do site?</label>
<select class="form-select mb-3 form-control" id="carro" name="carro" required="">
<option value="">Escolha um carro</option>
<option>Mazda 787B</option>
<option>Mazda RX-7</option>
<option>Mazda MX-5 Miata</option>
<option>Ferrari F40</option>
<option>Ferrari F80</option>
<option>Ferrari 250 GTO</option>
<option>Audi RS6 Avant</option>
<option>Audi Sport Quattro</option>
<option>Audi RS6 Avant GT</option>
<option>Koenigsegg Jesko Absolut</option>
<option>Koenigsegg CC850</option>
<option>Koenigsegg Agera RS</option>
</select>
<label class="form-label fw-semibold" for="feedback">Dê o seu feedback!</label>
<textarea class="form-control mb-3" id="feedback" name="feedback" placeholder="Digite seu texto aqui" required=""></textarea>
<label class="form-label fw-semibold" for="nome">Qual seu carro?</label>
<input class="form-control mb-3" id="nome" name="nome" placeholder="Digite seu carro" required="" type="text"/>
<input class="btn btn-primary w-100 form-control" id="submit" type="submit" value="Enviar"/>
</fieldset>
</form>
